<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | Sabor & Mesa</title>
    <link rel="stylesheet" href="../styles/syle.css">
</head>

<body class="menu-page">

    <nav class="menu">
        <h2>Sabor & Mesa</h2>

        <ul class="list-menu">
            <li><a href="./index.html">Inicio</a></li>
            <li class="selected"><a href="./cardapio.html">Cardapio</a></li>
            <li><a href="#">Sobre nós</a></li>
            <li><a href="#">Contato</a></li>
        </ul>

        <div class="menu-actions">
            <a href="#" class="btn-enter">Entrar</a>
            <hr>
            <a href="#" class="btn-cart" aria-label="Abrir carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>
    </nav>


    <main class="menu-page-main">

        <section class="menu-page-intro">
            <span>
                <i class="fa-solid fa-utensils"></i>
                NOSSO CARDÁPIO
            </span>

            <h1>Escolha seu prato</h1>

            <p>
                Explore nossas opções e adicione seus pratos favoritos ao carrinho.
            </p>
        </section>

        <div class="menu-gallery-content"></div>

    </main>


    <div class="product-modal">

        <div class="product-modal-content">

            <button class="product-modal-close" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <img class="modal-product-image" src="" alt="">

            <div class="modal-product-info">

                <span class="modal-product-category">
                    PRATO
                </span>

                <h2 class="modal-product-name"></h2>

                <p class="modal-product-description"></p>

                <div class="modal-product-price">
                    <span>Preço unitário</span>
                    <strong class="modal-unit-price"></strong>
                </div>

                <div class="modal-product-footer">

                    <div class="quantity-control">

                        <button class="quantity-minus" type="button">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <span class="quantity-value">1</span>

                        <button class="quantity-plus" type="button">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                    </div>

                    <div class="modal-total">
                        <span>Total</span>
                        <strong class="modal-total-price"></strong>
                    </div>

                </div>

                <button class="modal-add-cart" type="button">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Adicionar ao carrinho
                </button>

            </div>

        </div>

    </div>


    <aside class="cart">
        <header>
            <h2>Seu Carrinho</h2>

            <button class="cart-close" type="button" aria-label="Fechar carrinho">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>

        <!-- FORMA DE CONSUMO -->
        <section class="consumptionMethod">

            <h3>Forma de consumo</h3>


            <div class="consumptionOptions">

                <!-- RESTAURANTE -->
                <label class="consumptionOption active" data-method="restaurant" data-delivery-fee="0">

                    <input type="radio" name="consumptionMethod" value="restaurant" checked>

                    <div class="consumptionIcon">

                        <i class="fa-solid fa-utensils"></i>

                    </div>

                    <div class="consumptionInfo">

                        <strong>No restaurante</strong>

                        <span>
                            Sem taxa de entrega
                        </span>

                    </div>

                    <span class="radioIndicator"></span>

                </label>


                <!-- DELIVERY -->
                <label class="consumptionOption" data-method="delivery" data-delivery-fee="2.50">

                    <input type="radio" name="consumptionMethod" value="delivery">

                    <div class="consumptionIcon">

                        <i class="fa-solid fa-truck"></i>

                    </div>

                    <div class="consumptionInfo">

                        <strong>Delivery</strong>

                        <span>
                            Taxa de entrega: R$ 2,50
                        </span>

                    </div>

                    <span class="radioIndicator"></span>

                </label>

            </div>

        </section>

        <ul class="products-list">
            <!-- Os itens são renderizados pelo carrinho.js -->
        </ul>

        <button class="btn-clear-cart" type="button">
            <i class="fa-regular fa-trash-can"></i>
            Limpar carrinho
        </button>

        <div class="description-values">
            <div class="subtotal">
                <h5><i class="fa-regular fa-note-sticky"></i> Subtotal</h5>
                <span class="subtotal-value">R$ 134,60</span>
            </div>

            <div class="delivery-fee">
                <h5><i class="fa-solid fa-truck"></i> Taxa de entrega</h5>
                <span class="delivery-value">R$ 0,00</span>
            </div>
        </div>

        <div class="complete-purchase">
            <div class="text-complete-purchase">
                <h4>Total</h4>

                <span class="total-value">134,60</span>
            </div>

            <button class="btn-complete-purchase"><i class="fa-solid fa-lock"></i> Finalizar compra</button>
        </div>

    </aside>

    <div class="cart-overlay"></div>



    <script type="module" src="../scripts/cardapio.js"></script>
    <script src="https://kit.fontawesome.com/bf19b5ff3e.js" crossorigin="anonymous"></script>
</body>

</html>
